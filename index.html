<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捕蚊燈客服中心｜震大有限公司</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f4f8; --surface: #ffffff; --surface2: #f7f9fb;
    --border: #e2e8f0; --text: #1a2332; --text2: #64748b; --text3: #94a3b8;
    --accent: #0ea5e9; --accent-dark: #0284c7; --accent-light: #e0f2fe;
    --bot-bubble: #f1f5f9; --user-bubble: #0ea5e9; --user-text: #ffffff;
    --green: #22c55e; --shadow: 0 4px 24px rgba(14,165,233,0.10);
  }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .chat-card { width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow), 0 1px 3px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 700px; overflow: hidden; }
  .header { background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%); padding: 18px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header-avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .header-info { flex: 1; }
  .header-name { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
  .header-status { font-size: 12px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,0.3); }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar-sm { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-bottom: 2px; }
  .bot .msg-avatar-sm { background: var(--accent-light); }
  .user .msg-avatar-sm { background: #dbeafe; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; color: var(--text); }
  .bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; border: none; }
  .bubble strong { font-weight: 700; }
  .bubble ul { padding-left: 18px; margin-top: 6px; }
  .bubble ul li { margin-bottom: 4px; }
  .bubble .step { background: rgba(14,165,233,0.1); border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 0 8px 8px 0; margin: 6px 0; font-size: 13px; }
  .timestamp { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .bot .timestamp { text-align: left; padding-left: 36px; }
  .user .timestamp { text-align: right; padding-right: 36px; }
  #quick-area { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 7px; flex-shrink: 0; }
  .qr { font-size: 12.5px; padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--accent); background: var(--accent-light); color: var(--accent-dark); cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
  .qr:hover { background: var(--accent); color: #fff; }
  .typing-bubble { display: flex; gap: 5px; align-items: center; padding: 12px 16px; background: var(--bot-bubble); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
  .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: bounce 1.1s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-7px); opacity: 1; } }
  .input-area { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; gap: 8px; align-items: center; background: var(--surface); flex-shrink: 0; }
  #msg-input { flex: 1; border: 1.5px solid var(--border); border-radius: 24px; padding: 9px 16px; font-size: 14px; font-family: inherit; background: var(--surface2); color: var(--text); outline: none; transition: border-color 0.2s; }
  #msg-input:focus { border-color: var(--accent); background: var(--surface); }
  #msg-input::placeholder { color: var(--text3); }
  #send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.1s; flex-shrink: 0; }
  #send-btn:hover { background: var(--accent-dark); }
  #send-btn:active { transform: scale(0.92); }
  #send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>
<div class="chat-card">
  <div class="header">
    <div class="header-avatar">🦟</div>
    <div class="header-info">
      <div class="header-name">捕蚊燈客服中心｜震大有限公司</div>
      <div class="header-status"><span class="status-dot"></span>AI 智慧客服 · 隨時為您服務</div>
    </div>
  </div>
  <div id="messages"></div>
  <div id="quick-area">
    <button class="qr" onclick="sendQuick('WE-119捕蚊燈報修')">🔧 WE-119 報修</button>
    <button class="qr" onclick="sendQuick('小元寶捕蚊燈報修')">🔧 小元寶報修</button>
    <button class="qr" onclick="sendQuick('WE-119使用教學')">📖 WE-119 使用教學</button>
    <button class="qr" onclick="sendQuick('更換捕蚊紙教學')">📄 更換捕蚊紙</button>
    <button class="qr" onclick="sendQuick('如何聯絡真人客服？')">👤 真人客服</button>
  </div>
  <div class="input-area">
    <input id="msg-input" type="text" placeholder="請輸入您的問題..." autocomplete="off" />
    <button id="send-btn" onclick="handleSend()" aria-label="送出">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
<script>
const GEMINI_API_KEY = 'AQ.Ab8RN6LAQCEVNKxTi1LG4r-8pAHRxyO4ntjOphhtlLFEZDZLhw';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

const SYSTEM = `你是一位專業、親切的繁體中文客服助理，服務品牌是「捕蚊燈客服中心」，主要協助用戶解決以下問題：

2. 確認燈具開關是否有打開。
3. 將開關左邊的【白色啟動器】逆時針旋轉拆卸下來，拿到水電行購買同型號的進行更換。
   更換啟動器（最常見問題）教學影片：https://www.youtube.com/watch?v=GbOOmyolxrg
4. 請將燈管以水平方式向左拔出，檢查是否有變黑的情形。
   如果您有備用燈管，可以參考此燈管更換影片：https://www.youtube.com/watch?v=Y4Z3ND_9Vvc
5. 若以上步驟仍無法解決，請依照下列範本填寫資訊，會有專人聯絡：
燈具型號:

地址:台北市OO區OO路OO號
報修人姓名:
電話:

【到場檢修收費說明】
如需安排人員到場檢修或更換燈管，將收取以下費用並附上發票（零用金支付）：
- 燈管：NT$250 元／支
- 工資（新竹以北）：NT$525 元
- 工資（新竹以南）：NT$840 元

【小元寶捕蚊燈報修】
請按照下列步驟測試燈具功能是否正常：
1. 關掉燈具左上方開關。
2. 順時針或逆時針旋轉燈管，看看是否能正常拆卸及裝回。
3. 如可正常拆卸，請撥打電話聯繫客服人員安排到場更換燈管。
4. 如不可正常拆卸，需將舊的捕蚊燈進行汰舊換新流程，請聯繫我們，我們將傳真檢修單給您，再請您拿檢修單向區課長申請汰舊換新。
   聯繫時請提供以下資訊：
   - 店名：
   - 聯絡人：
   - 電話號碼：
   - 傳真號碼：

【WE-119 使用教學】
- 安裝位置：離地面 1.5～2 公尺，遠離其他光源，放置於蚊蟲活動區域
- 使用時機：建議 24 小時連續開機，效果最佳
- 清潔保養：每 2 週清潔一次集蟲盒，使用乾布輕拭藍紫光管，切勿用水清洗燈管
- 注意事項：
  - 請勿在雨天或潮濕環境使用
  - 燈管壽命約 6,000 小時
  - 使用時關閉室內其他燈光效果更佳
  - 不可直視藍紫光，避免傷害眼睛

【更換捕蚊紙教學】
更換捕蚊紙的詳細步驟可參考以下影片教學：
👉 影片連結：https://www.youtube.com/watch?v=PIn89RMOygk

其他通用資訊：
- 真人客服電話：(02)2795-4988
- 服務時間：週一至週五 9:00～12:00、13:00～18:00（國定假日放假）
- LINE 官方帳號：@817yhjpl

回答規則：
- 用繁體中文回答，語氣親切自然
- 善用條列或步驟呈現，讓內容清晰易讀
- 若問題超出範疇，請引導用戶聯繫真人客服
- 回答長度適中，不要過於冗長`;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msg-input');
let isTyping = false;
let history = [];

function now() { return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); }

function addMsg(role, html) {
  const isUser = role === 'user';
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'user' : 'bot');
  row.innerHTML = `<div class="msg-avatar-sm">${isUser ? '🧑' : '🦟'}</div><div><div class="bubble">${html}</div><div class="timestamp">${now()}</div></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot'; row.id = 'typing';
  row.innerHTML = `<div class="msg-avatar-sm">🦟</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatReply(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:var(--accent);text-decoration:underline;">$1</a>');
  html = html.replace(/^(\d+)\.\s(.+)$/gm, '<div class="step"><strong>$1.</strong> $2</div>');
  html = html.replace(/((?:^[-•]\s.+\n?)+)/gm, (m) => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[-•]\s/,'')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function callAPI(userMsg) {
  history.push({ role: 'user', parts: [{ text: userMsg }] });
  showTyping();
  isTyping = true;
  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM }] },
        contents: history,
        generationConfig: { maxOutputTokens: 1000 }
      })
    });
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '抱歉，我暫時無法回應，請稍後再試或致電 (02)2795-4988。';
    history.push({ role: 'model', parts: [{ text: reply }] });
    removeTyping();
    addMsg('bot', formatReply(reply));
  } catch(e) {
    removeTyping();
    addMsg('bot', '連線發生問題，請稍後再試。<br>如需立即協助，請致電 <strong>(02)2795-4988</strong> 或 LINE：<strong>@817yhjpl</strong>。');
  }
  isTyping = false;
}

function handleSend() {
  const text = inputEl.value.trim();
  if (!text || isTyping) return;
  inputEl.value = '';
  addMsg('user', escapeHtml(text));
  callAPI(text);
}

function sendQuick(text) {
  if (isTyping) return;
  addMsg('user', escapeHtml(text));
  callAPI(text);
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
addMsg('bot', '您好！歡迎來到<strong>震大有限公司 捕蚊燈客服中心</strong> 👋<br>我是您的 AI 客服助理，可協助您處理：<ul><li>WE-119 捕蚊燈報修</li><li>小元寶捕蚊燈報修</li><li>WE-119 使用教學</li><li>更換捕蚊紙教學</li></ul>請問有什麼可以幫助您的？');
</script>
</body>
</html>
